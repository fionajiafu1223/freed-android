<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>好处坏处释放 · Freed Releasing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --sat: env(safe-area-inset-top, 0px); }


  body {
    font-family:'Noto Sans SC',sans-serif;
    min-height:100vh;
    overflow-x:hidden; position:relative;
    background:#082f60;
  }

  /* ══ SPLIT BACKGROUNDS ══ */
  .bg-half { position:fixed; top:0; width:50%; height:100%; z-index:0; }
  #bgLeft  {
    left:0;
    background:linear-gradient(180deg,
      #b8daf5 0%, #6aaee0 38%, #2e82cc 52%, #0f4a8a 100%);
  }
  #bgRight {
    right:0;
    background:linear-gradient(180deg,
      #b0cce6 0%, #68a0cc 38%, #2e78b8 52%, #134a82 100%);
  }

  /* Extra murk tint on right underwater — blue-tinted turbidity */
  #murkTint {
    position:fixed; top:52%; left:50%; width:50%; height:48%;
    background:
      radial-gradient(ellipse 90% 70% at 60% 30%, rgba(30,55,90,0.14) 0%, transparent 70%),
      linear-gradient(180deg, rgba(25,48,80,0.07) 0%, rgba(15,32,58,0.18) 100%);
    z-index:1; pointer-events:none;
  }

  /* Suspended murk specks */
  .murk-speck {
    position:fixed; border-radius:50%;
    background:rgba(95,128,168,0.13);
    pointer-events:none; z-index:2;
    animation:murkBob ease-in-out infinite alternate;
  }
  @keyframes murkBob {
    0%   { transform:translate(0,0);      opacity:0.15; }
    100% { transform:translate(6px,-12px); opacity:0.30; }
  }

  /* ══ CENTER DIVIDER ══ */
  #divider { display:none; }

  /* ══ SIDE LABELS at waterline ══ */
  .side-label {
    position:fixed; z-index:22;
    font-family:'Noto Serif SC',serif;
    font-size:0.80rem; font-weight:600; letter-spacing:0.14em;
    padding:4px 16px; border-radius:20px;
    pointer-events:none; white-space:nowrap;
  }
  #lblBenefit {
    left:25%; transform:translateX(-50%);
    color:#0b2c48;
    background:rgba(255,255,255,0.52);
    border:1px solid rgba(255,255,255,0.75);
    box-shadow:0 2px 12px rgba(0,90,180,0.15);
    backdrop-filter:blur(6px);
  }
  #lblDrawback {
    left:75%; transform:translateX(-50%);
    color:#0b2c48;
    background:rgba(255,255,255,0.45);
    border:1px solid rgba(255,255,255,0.65);
    box-shadow:0 2px 12px rgba(0,60,140,0.18);
    backdrop-filter:blur(6px);
  }

  /* ══ CLOUDS ══ */
  .sky-clouds {
    position:fixed; top:0; left:0; width:100%; height:55%;
    pointer-events:none; z-index:1; overflow:hidden;
  }
  .cloud { position:absolute; border-radius:50px; animation:cloudDrift linear infinite; }
  .cloud.bright { background:rgba(255,255,255,0.52); filter:blur(9px); }
  .cloud.grey   { background:rgba(205,210,222,0.42); filter:blur(13px); }
  @keyframes cloudDrift {
    0%   { transform:translateX(-140px); opacity:0; }
    9%   { opacity:1; }
    88%  { opacity:0.72; }
    100% { transform:translateX(calc(100vw + 140px)); opacity:0; }
  }

  /* ══ WATER SURFACE SVG ══ */
  .water-surface { position:fixed; left:0; right:0; pointer-events:none; z-index:10; }

  /* ══ UNDERWATER RAYS ══ */
  .underwater-rays {
    position:fixed; left:0; bottom:0; width:100%;
    height:50%; pointer-events:none; z-index:2; overflow:hidden;
  }
  .ray { position:absolute; bottom:0; width:58px; transform-origin:bottom center; animation:rayWave ease-in-out infinite alternate; }
  .ray.r-clear { background:linear-gradient(180deg,transparent,rgba(80,185,255,0.07)); }
  .ray.r-murky { background:linear-gradient(180deg,transparent,rgba(80,115,170,0.07)); }
  @keyframes rayWave {
    0%   { transform:skewX(-4deg) scaleX(1);    opacity:0.45; }
    100% { transform:skewX( 4deg) scaleX(1.15); opacity:0.90; }
  }

  /* ══ HEADER ══ */
  .header {
    position:relative; z-index:22;
    text-align:center; padding:max(18px, calc(env(safe-area-inset-top, 0px) + 8px)) 20px 3px; width:100%; pointer-events:none;
  }
  .header h1 {
    font-family:'Noto Serif SC',serif;
    font-size:1.32rem; font-weight:300; letter-spacing:0.20em;
    color:#fff;
    text-shadow: 0 1px 10px rgba(0,30,70,0.55), 0 0 2px rgba(255,255,255,0.3);
  }
  .header p { font-size:0.69rem; letter-spacing:0.12em; font-weight:300; color:rgba(235,245,255,0.92); margin-top:3px; text-shadow: 0 1px 6px rgba(0,30,70,0.4); }

  /* ══ ZONE LABELS ══ */
  .zone-label { position:fixed; pointer-events:none; z-index:22; font-family:'Noto Serif SC',serif; font-size:0.80rem; font-weight:600; letter-spacing:0.09em; }
  #lbCL { left:12px;             color:#0c2d48; }
  #lbSL { left:12px;             color:rgba(155,215,255,0.72); }

  /* ══ SCENE ══ */
  .scene { position:fixed; top:0; left:0; right:0; bottom:0; z-index:5; pointer-events:none; overflow:hidden; }

  /* ══ BUBBLE BASE ══ */
  .bubble {
    position:absolute; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    text-align:center; font-family:'Noto Serif SC',serif; font-weight:600;
    line-height:1.35; user-select:none; will-change:left,top,opacity;
  }


  /* LEFT idle (clear, bright) */
  .bubble.idle.L {
    cursor:pointer; z-index:8; pointer-events:auto; color:#fff;
    background:radial-gradient(circle at 32% 28%, rgba(200,230,255,0.55),rgba(60,120,220,0.38));
    border:2px solid rgba(180,230,255,0.7);
    box-shadow:0 2px 12px rgba(0,60,160,0.28),inset 0 1px 0 rgba(255,255,255,0.38);
    backdrop-filter:blur(3px); text-shadow:0 1px 6px rgba(0,30,80,0.6);
  }
  .bubble.idle.L.bc { background:radial-gradient(circle at 35% 30%, rgba(255,192,210,0.58),rgba(187,46,77,0.38)); border-color:rgba(246,134,160,0.68); }
  .bubble.idle.L.ba { background:radial-gradient(circle at 35% 30%, rgba(153,251,200,0.58),rgba(20,122,65,0.38)); border-color:rgba(87,198,134,0.68); }
  .bubble.idle.L.bs { background:radial-gradient(circle at 35% 30%, rgba(161,202,255,0.58),rgba(38,69,207,0.38)); border-color:rgba(104,150,255,0.68); }
  .bubble.idle.L:hover  { filter:brightness(1.18); transform:scale(1.07); }
  .bubble.idle.L:active { transform:scale(0.92); }

  /* 左侧光晕脉动 */
  @keyframes auraPulseL {
    0%   { box-shadow: 0 0 10px 3px var(--aura), 0 0 28px 8px var(--aura-far), inset 0 1px 0 rgba(255,255,255,0.35); }
    50%  { box-shadow: 0 0 20px 8px var(--aura), 0 0 48px 16px var(--aura-far), inset 0 1px 0 rgba(255,255,255,0.35); }
    100% { box-shadow: 0 0 10px 3px var(--aura), 0 0 28px 8px var(--aura-far), inset 0 1px 0 rgba(255,255,255,0.35); }
  }
  .bubble.idle.L.bc { --aura: rgba(145,38,62,0.22); --aura-far: rgba(145,38,62,0.09); animation: auraPulseL 3.2s ease-in-out infinite; }
  .bubble.idle.L.ba { --aura: rgba(18,100,55,0.22); --aura-far: rgba(18,100,55,0.09); animation: auraPulseL 3.6s ease-in-out infinite; }
  .bubble.idle.L.bs { --aura: rgba(32,56,165,0.22); --aura-far: rgba(32,56,165,0.09); animation: auraPulseL 4.0s ease-in-out infinite; }

  /* RIGHT idle (murky, dark) */
  .bubble.idle.R {
    cursor:pointer; z-index:8; pointer-events:auto; color:#fff;
    background:radial-gradient(circle at 32% 28%, rgba(120,130,185,0.42),rgba(35,40,95,0.48));
    border:1.5px solid rgba(95,110,175,0.55);
    box-shadow:0 2px 13px rgba(15,15,75,0.40),inset 0 1px 0 rgba(185,195,255,0.45),inset -1px -1px 4px rgba(25,30,140,0.28);
    backdrop-filter:blur(3px); text-shadow:0 1px 5px rgba(10,8,65,0.55);
  }
  .bubble.idle.R.bc { background:radial-gradient(circle at 32% 28%, rgba(195,110,150,0.46),rgba(110,40,85,0.46)); border-color:rgba(180,100,140,0.58); }
  .bubble.idle.R.ba { background:radial-gradient(circle at 32% 28%, rgba(105,160,150,0.46),rgba(25,90,80,0.46)); border-color:rgba(90,150,135,0.58); }
  .bubble.idle.R.bs { background:radial-gradient(circle at 32% 28%, rgba(120,125,205,0.46),rgba(35,40,150,0.46)); border-color:rgba(100,110,195,0.58); }
  .bubble.idle.R:hover  { filter:brightness(1.14); transform:scale(1.07); }
  .bubble.idle.R:active { transform:scale(0.92); }

  /* 右侧光晕脉动（冷紫调，帮助气泡从暗背景中跳出来） */
  @keyframes auraPulseR {
    0%   { box-shadow: 0 0 10px 3px var(--aura), 0 0 28px 8px var(--aura-far), inset 0 1px 0 rgba(220,220,255,0.30); }
    50%  { box-shadow: 0 0 20px 8px var(--aura), 0 0 48px 16px var(--aura-far), inset 0 1px 0 rgba(220,220,255,0.30); }
    100% { box-shadow: 0 0 10px 3px var(--aura), 0 0 28px 8px var(--aura-far), inset 0 1px 0 rgba(220,220,255,0.30); }
  }
  .bubble.idle.R.bc { --aura: rgba(180,70,120,0.26); --aura-far: rgba(180,70,120,0.10); animation: auraPulseR 3.2s ease-in-out infinite; }
  .bubble.idle.R.ba { --aura: rgba(60,150,125,0.26); --aura-far: rgba(60,150,125,0.10); animation: auraPulseR 3.6s ease-in-out infinite; }
  .bubble.idle.R.bs { --aura: rgba(80,90,210,0.26); --aura-far: rgba(80,90,210,0.10); animation: auraPulseR 4.0s ease-in-out infinite; }

  .bubble.idle { animation:none; }
  .bubble.rising { cursor:default; z-index:12; pointer-events:none; }

  /* At surface */
  .bubble.at-surface {
    cursor:default; z-index:15; pointer-events:none;
    border:none !important;
    box-shadow: 0 6px 28px rgba(0,100,200,0.28) !important;
    color:#0e2840 !important; text-shadow:none !important; backdrop-filter:blur(6px);
  }
  .bubble.at-surface.bc  { background: radial-gradient(circle at 34% 28%, rgba(255,210,220,0.88), rgba(210,80,110,0.65)) !important; color: #3a0a18 !important; }
  .bubble.at-surface.ba  { background: radial-gradient(circle at 34% 28%, rgba(200,255,225,0.88), rgba(50,170,105,0.65)) !important; color: #063020 !important; }
  .bubble.at-surface.bs  { background: radial-gradient(circle at 34% 28%, rgba(210,225,255,0.88), rgba(70,110,220,0.65)) !important; color: #080e38 !important; }
  .bubble.at-surface.bm  { background: radial-gradient(circle at 34% 28%, rgba(235,240,255,0.95), rgba(160,120,220,0.7)) !important; border: none !important; color: #1a0a38 !important; }
  .bubble.at-surface.bm3 { background: radial-gradient(circle at 34% 28%, rgba(255,240,220,0.95), rgba(180,130,80,0.65)) !important; border: none !important; color: #2a1400 !important; }

  /* Decision buttons */
  .surf-btn {
    position: fixed; z-index: 18;
    width: 62px; height: 62px; border-radius: 50%; border: none;
    font-family: 'Noto Serif SC', serif; font-size: 0.74rem; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.3;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease, transform 0.15s ease;
  }
  .surf-btn.show { opacity: 1; pointer-events: auto; }
  #sharedDeny, #sharedAllow, #rqNo, #rqYes {
    background: radial-gradient(circle at 38% 32%, rgba(255,255,255,0.98), rgba(200,215,235,0.88));
    color: #1a3050; font-weight: 500;
    border: none;
    box-shadow:
      inset 0 1.5px 2px rgba(255,255,255,1),
      inset 0 -2px 4px rgba(160,180,210,0.5),
      0 6px 20px rgba(0,20,60,0.35),
      0 2px 6px rgba(0,10,40,0.25),
      0 1px 0 rgba(0,0,0,0.12);
    text-shadow: none;
  }
  .surf-btn:hover {
    background: radial-gradient(circle at 38% 32%, rgba(255,255,255,1), rgba(215,228,248,0.92));
    transform: scale(1.08) translateY(-2px);
    box-shadow:
      inset 0 1.5px 2px rgba(255,255,255,1),
      inset 0 -2px 4px rgba(160,180,210,0.45),
      0 10px 28px rgba(0,20,60,0.4),
      0 3px 8px rgba(0,10,40,0.25);
  }
  .surf-btn:active {
    background: radial-gradient(circle at 38% 32%, rgba(235,240,250,0.98), rgba(190,205,228,0.9));
    transform: scale(0.96) translateY(2px);
    box-shadow:
      inset 0 1px 3px rgba(140,160,200,0.4),
      inset 0 2px 5px rgba(0,0,0,0.08),
      0 2px 8px rgba(0,20,60,0.28);
  }

  #surfQ {
    position:fixed; z-index:22;
    left:50%; transform:translateX(-50%);
    font-family:'Noto Serif SC',serif;
    letter-spacing:0.08em;
    pointer-events:none; text-align:center;
    opacity:0; transition:opacity 0.38s ease;
    line-height:1.8; width:min(90vw, 480px);
  }
  #surfQ .sq-main {
    font-size:1.05rem; font-weight:400;
    color:rgba(230,248,255,0.97);
    text-shadow:0 2px 16px rgba(0,40,120,0.8), 0 0 30px rgba(80,180,255,0.35);
    display:block;
  }
  #surfQ .sq-sub {
    font-size:0.82rem; font-weight:300;
    color:rgba(210,238,255,0.88);
    text-shadow:0 1px 10px rgba(0,20,80,0.8);
    display:block; margin-top:8px;
  }
  #surfQ.show { opacity:1; }

  /* ══ SECOND QUESTION (after allow/deny) ══ */
  #releaseQ {
    position:fixed; left:50%; transform:translateX(-50%);
    z-index:22; pointer-events:none; text-align:center;
    opacity:0; transition:opacity 0.45s ease;
    line-height:1.8; width:min(90vw, 460px);
  }
  #releaseQ.show { opacity:1; pointer-events:auto; }
  #releaseQ .rq-main {
    font-family:'Noto Serif SC',serif;
    font-size:1.05rem; font-weight:400; letter-spacing:0.10em;
    color:rgba(230,248,255,0.97);
    text-shadow:0 2px 16px rgba(0,40,120,0.8), 0 0 40px rgba(80,180,255,0.35);
    display:block; margin-bottom:18px;
  }
  .rq-btn:hover  { transform:scale(1.07); }
  .rq-btn:active { transform:scale(0.93); }

  @keyframes escapeToSky {
    0%   { opacity:1;    transform:translateY(0)     scale(1);    }
    14%  { opacity:0.95; transform:translateY(-50px)  scale(1.07); }
    55%  { opacity:0.50; transform:translateY(-190px) scale(0.72); }
    100% { opacity:0;    transform:translateY(-430px) scale(0.06); }
  }
  .go-sky { animation:escapeToSky 1.95s cubic-bezier(0.22,0.58,0.38,0.96) forwards !important; pointer-events:none !important; z-index:19 !important; }

  .uw-particle { position:absolute; border-radius:50%; animation:uwFloat linear infinite; pointer-events:none; }
  .uw-particle.pL { background:rgba(100,205,255,0.18); }
  .uw-particle.pR { background:rgba(50,100,170,0.14); }
  @keyframes uwFloat {
    0%   { transform:translateY(0);     opacity:0;    }
    10%  { opacity:0.55; }
    90%  { opacity:0.12; }
    100% { transform:translateY(-58vh); opacity:0;    }
  }

  .toast {
    position:fixed; bottom:58px; left:50%;
    transform:translateX(-50%) translateY(10px);
    background:rgba(255,255,255,0.93); backdrop-filter:blur(12px);
    color:#0e2840; padding:9px 26px; border-radius:40px;
    font-family:'Noto Serif SC',serif; font-size:0.84rem; letter-spacing:0.04em;
    opacity:0; transition:all 0.38s ease; pointer-events:none; z-index:200;
    white-space:nowrap; box-shadow:0 4px 22px rgba(0,0,0,0.13);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .counter { position:fixed; bottom:9px; left:50%; transform:translateX(-50%); z-index:22; font-family:'Noto Serif SC',serif; font-size:0.63rem; color:rgba(135,198,255,0.55); letter-spacing:0.12em; text-shadow:0 1px 4px rgba(0,0,60,0.4); }

  /* ══ GUIDANCE CARD (centered, above waterline) ══ */
  #guidanceCard {
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    z-index:22; pointer-events:none;
    text-align:center; width:min(90vw, 480px);
    transition:opacity 0.5s ease;
  }
  #guidanceCard.hidden { opacity:0; }
  #guidanceMain {
    font-family:'Noto Serif SC',serif;
    font-size:1.05rem; font-weight:400; letter-spacing:0.10em;
    color:rgba(230,248,255,0.97);
    text-shadow:0 2px 16px rgba(0,40,120,0.8), 0 0 40px rgba(80,180,255,0.35);
    line-height:1.6;
  }
  #guidanceSub {
    font-family:'Noto Serif SC',serif;
    font-size:1.05rem; letter-spacing:0.10em; font-weight:400;
    color:rgba(230,248,255,0.97);
    margin-top:14px;
    text-shadow:0 2px 16px rgba(0,40,120,0.8), 0 0 40px rgba(80,180,255,0.35);
    line-height:1.8;
  }

  /* ══ TOPIC MODAL ══ */
  #topicOverlay {
    position:fixed; inset:0; z-index:300;
    background:rgba(150,205,240,0.30);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    opacity:1; transition:opacity 0.55s ease;
  }
  #topicOverlay.hide { opacity:0; pointer-events:none; }

  #topicCard {
    background:linear-gradient(145deg, rgba(255,255,255,0.62) 0%, rgba(200,230,255,0.32) 100%);
    border:none;
    border-radius:24px;
    padding:38px 36px 32px;
    width:min(88vw, 360px);
    box-shadow:
      0 30px 70px rgba(20,60,110,0.32),
      0 12px 28px rgba(20,60,110,0.20),
      0 4px 10px rgba(20,60,110,0.14),
      inset 0 -2px 8px rgba(110,170,225,0.20);
    backdrop-filter:blur(20px);
    text-align:center;
    transform:translateY(0px);
    animation:cardFloat 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes cardFloat {
    from { opacity:0; transform:translateY(32px) scale(0.96); }
    to   { opacity:1; transform:translateY(0)    scale(1);    }
  }

  #topicCard h2 {
    font-family:'Noto Serif SC',serif;
    font-size:1.10rem; font-weight:400; letter-spacing:0.16em;
    color:#0e3050; margin-bottom:8px;
  }
  #topicCard .sub {
    font-size:0.72rem; letter-spacing:0.07em; font-weight:300;
    color:rgba(45,85,125,0.72); margin-bottom:26px; line-height:1.7;
  }
  #topicInput {
    width:100%; background:rgba(255,255,255,0.55);
    border:1px solid rgba(120,185,230,0.5); border-radius:12px;
    padding:12px 16px; color:#0e3050;
    font-family:'Noto Serif SC',serif; font-size:0.92rem; letter-spacing:0.04em;
    outline:none; text-align:center; caret-color:rgba(60,140,210,0.9);
    box-shadow: inset 0 2px 5px rgba(40,90,150,0.12);
    transition:border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    margin-bottom:20px;
  }
  #topicInput::placeholder { color:rgba(60,100,140,0.42); }
  #topicInput:focus {
    border-color:rgba(100,175,230,0.80);
    background:rgba(255,255,255,0.75);
  }
  #topicStart {
    width:100%; padding:13px; border-radius:50px; border:none;
    background:linear-gradient(135deg, #4a9fd4 0%, #4a9fd4 60%, #3ab8a0 100%);
    color:#fff; font-family:'Noto Serif SC',serif;
    font-size:0.88rem; letter-spacing:0.14em; font-weight:600;
    cursor:pointer;
    position:relative; overflow:hidden;
    box-shadow:
      0 4px 14px rgba(42,160,140,0.25),
      0 2px 6px rgba(0,0,0,0.10),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transition: opacity 0.2s ease, transform 0.15s ease, box-shadow 0.18s ease;
  }
  #topicStart::after {
    content:''; position:absolute; top:0; left:0; right:0; height:50%;
    background:linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 100%);
    border-radius:50px 50px 0 0; pointer-events:none;
  }
  #topicStart:hover {
    opacity:0.92; transform:translateY(-1px);
    box-shadow:
      0 8px 24px rgba(42,160,140,0.48),
      0 3px 8px rgba(0,0,0,0.18),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  #topicStart:active {
    transform:translateY(1px);
    box-shadow: 0 3px 10px rgba(42,160,140,0.35);
  }

  #topicSkip {
    display:block; margin-top:14px;
    font-size:0.68rem; letter-spacing:0.09em; color:rgba(45,85,125,0.55);
    cursor:pointer; background:none; border:none;
    transition:color 0.2s ease;
  }
  #topicSkip:hover { color:rgba(20,60,100,0.85); }
</style>
</head>
<body>

<div class="bg-half" id="bgLeft"></div>
<div class="bg-half" id="bgRight"></div>
<div id="murkTint"></div>
<div id="divider"></div>
<div class="sky-clouds" id="skyClouds"></div>
<div class="underwater-rays" id="uwRays"></div>

<!-- Topic input modal -->
<div id="topicOverlay">
  <div id="topicCard">
    <h2>好处 · 坏处释放</h2>
    <p class="sub">选择一件让你困扰或想改变的事<br>我们将一起觉察它两面的欲望</p>
    <input id="topicInput" type="text" maxlength="30" placeholder="例如：换工作、这段关系……" />
    <button id="topicStart" onclick="startSession()">开始释放</button>
    <button id="topicSkip" onclick="startSession()">先不填，直接开始</button>
  </div>
</div>

<div class="header">
  <h1>好处坏处释放</h1>
  <p>觉察 · 允许 · 释放</p>
</div>

<div class="side-label" id="lblBenefit">好处</div>
<div class="side-label" id="lblDrawback">坏处</div>

<div class="zone-label" id="lbCL">表意识</div>
<div class="zone-label" id="lbSL">潜意识</div>

<svg class="water-surface" id="waterSvg" xmlns="http://www.w3.org/2000/svg"
     style="position:fixed;left:0;width:100%;pointer-events:none;z-index:10;">
  <defs>
    <linearGradient id="wgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(10,80,160,0.9)"/>
      <stop offset="8%" stop-color="rgba(8,60,120,0)"/>
    </linearGradient>
    <linearGradient id="wgR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(9,54,101,0.9)"/>
      <stop offset="8%" stop-color="rgba(7,40,78,0)"/>
    </linearGradient>
  </defs>
  <path id="waveL"  fill="url(#wgL)"             opacity="0.95"/>
  <path id="waveR"  fill="url(#wgR)"             opacity="0.95"/>
  <path id="waveL2" fill="rgba(15,100,190,0.35)" opacity="0.7"/>
  <path id="waveR2" fill="rgba(18,82,150,0.32)"   opacity="0.7"/>
</svg>

<div class="scene" id="scene"></div>

<button class="surf-btn" id="sharedDeny"  onclick="handleDecision(false)">不允许</button>
<button class="surf-btn" id="sharedAllow" onclick="handleDecision(true)">允许</button>
<div id="surfQ">
  <span class="sq-main">你能允许这个欲望存在吗？</span>
</div>

<div id="releaseQ">
  <span class="rq-main" id="releaseQText">你能放下想要「」的欲望吗？</span>
</div>
<button class="surf-btn" id="rqNo"  onclick="handleRelease(false)">不能</button>
<button class="surf-btn" id="rqYes" onclick="handleRelease(true)">能</button>

<div id="guidanceCard">
  <div id="guidanceMain"></div>
  <div id="guidanceSub"></div>
</div>
<div class="counter" id="counter">已释放 0 个欲望</div>
<div class="toast"   id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════
const DESIRES = [
  { key:'control',  label:'想要\n控制', cls:'bc' },
  { key:'approval', label:'想要\n认同', cls:'ba' },
  { key:'safety',   label:'想要\n安全', cls:'bs' },
];
const SPAWN_GAP     = 220;
const RISE_SPEED    = 240;
const WATER_Y_PCT   = 0.52;
const TSZ           = 90;
const IDLE_PER_SIDE = Math.max(5, Math.min(10,
  Math.floor(window.innerWidth * window.innerHeight * (1 - WATER_Y_PCT) / 28000)
));

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
let idleBubbles  = [];
let risingSlots  = [null, null, null];
let mergedBubble = null;
let released     = 0;

// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════
const waterY = () => window.innerHeight * WATER_Y_PCT;
const vw     = () => window.innerWidth;
const vh     = () => window.innerHeight;
const halfW  = () => window.innerWidth / 2;

// ═══════════════════════════════════════════════════
//  PHYSICS
// ═══════════════════════════════════════════════════
const BUOYANCY    = 0.003;
const DAMPING     = 0.97;
const REPULSION   = 60;
const WALL_REP    = 40;
const WALL_MARGIN = 8;
const DOM_EVERY   = 4;
let   frameCount  = 0;

function physicsTick() {
  const wy = waterY(), W = vw(), H = vh(), hw = halfW();
  frameCount++;
  const doDOM = (frameCount % DOM_EVERY === 0);

  const CELL = 72;
  const grid = new Map();
  for (const b of idleBubbles) {
    const key = ((b.px / CELL)|0) * 1000 + ((b.py / CELL)|0);
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(b);
  }

  for (const b of idleBubbles) {
    const r = b.sz / 2;

    // Buoyancy
    const depth = (b.py - wy) / (H - wy);
    b.vy -= BUOYANCY * (0.3 + depth * 1.4);

    // Repulsion
    const cx = (b.px/CELL)|0, cy = (b.py/CELL)|0;
    for (let nx = cx-1; nx <= cx+1; nx++) {
      for (let ny = cy-1; ny <= cy+1; ny++) {
        const nb = grid.get(nx*1000+ny);
        if (!nb) continue;
        for (const o of nb) {
          if (o === b) continue;
          const dx = b.px-o.px, dy = b.py-o.py;
          const d2 = dx*dx + dy*dy;
          const md = r + o.sz/2;
          if (d2 < md*md && d2 > 0.001) {
            const d = Math.sqrt(d2);
            const f = REPULSION*(md-d)/(md*d);
            b.vx += dx*f; b.vy += dy*f;
          }
        }
      }
    }

    // Wall repulsion — keep bubble on its assigned side
    const isL  = b.side === 'L';
    const xMin = isL ? r + WALL_MARGIN : hw + r + 6;
    const xMax = isL ? hw - r - 6      : W - r - WALL_MARGIN;
    const top  = wy + r, bot = H - r - WALL_MARGIN;

    if (b.px < xMin + 40) b.vx += WALL_REP / Math.max(1, b.px - xMin);
    if (b.px > xMax - 40) b.vx -= WALL_REP / Math.max(1, xMax - b.px);
    if (b.py < top  + 50) b.vy += WALL_REP*3 / Math.max(1, b.py - top);
    if (b.py > bot  - 40) b.vy -= WALL_REP / Math.max(1, bot - b.py);

    b.vx *= DAMPING; b.vy *= DAMPING;
    const s2 = b.vx*b.vx + b.vy*b.vy;
    if (s2 > 0.36) { const s = 0.6/Math.sqrt(s2); b.vx*=s; b.vy*=s; }

    b.px += b.vx; b.py += b.vy;
    b.px = Math.max(xMin, Math.min(xMax, b.px));
    b.py = Math.max(top,  Math.min(bot,  b.py));
    if (b.py <= top) { b.py = top; b.vy = 0; }

    if (doDOM) {
      b.el.style.left = `${(b.px - r)|0}px`;
      b.el.style.top  = `${(Math.max(wy, b.py - r))|0}px`;
    }
  }
  requestAnimationFrame(physicsTick);
}

function placeOnSide(sz, side) {
  const wy = waterY(), W = vw(), H = vh(), hw = halfW();
  const r = sz/2, pad = 6;
  const xMin = side==='L' ? r+pad  : hw+r+pad;
  const xMax = side==='L' ? hw-r-6 : W-r-pad;
  for (let a = 0; a < 120; a++) {
    const dep = Math.random() * Math.random();
    const py  = wy + r + pad + dep*(H - wy - r*2 - pad*2);
    const px  = xMin + Math.random()*(xMax - xMin);
    let ok = true;
    for (const b of idleBubbles)
      if (Math.hypot(px-b.px, py-b.py) < r+b.sz/2) { ok=false; break; }
    if (ok) return {px,py};
  }
  return {
    px: xMin + Math.random()*(xMax-xMin),
    py: wy + r + pad + Math.random()*Math.random()*(H-wy-r*2-pad*2),
  };
}

// ═══════════════════════════════════════════════════
//  SURFACE SLOT — always dead center
// ═══════════════════════════════════════════════════
function surfaceSlotPos() {
  return { x: vw()*0.50, y: waterY() - TSZ*1.1 };
}

// ═══════════════════════════════════════════════════
//  SPAWN IDLE BUBBLE
// ═══════════════════════════════════════════════════
function spawnIdleBubble(desireHint, sideHint) {
  const side = sideHint || (
    idleBubbles.filter(b=>b.side==='L').length <=
    idleBubbles.filter(b=>b.side==='R').length ? 'L' : 'R'
  );

  let desire;
  if (desireHint) {
    desire = desireHint;
  } else {
    const pool   = idleBubbles.filter(b=>b.side===side);
    const counts = DESIRES.map(d=>({ d, n:pool.filter(b=>b.desire.key===d.key).length }));
    counts.sort((a,b)=>a.n-b.n);
    desire = counts[0].d;
  }

  const sz  = Math.round((62 + Math.floor(Math.random()*24)) * 1.1);
  const pos = placeOnSide(sz, side);

  const el  = document.createElement('div');
  el.className = `bubble ${desire.cls} idle ${side}`;
  el.innerHTML = desire.label.replace('\n','<br>');

  el.style.cssText = `
    width:${sz}px; height:${sz}px;
    left:${pos.px-sz/2}px; top:${Math.max(waterY(),pos.py-sz/2)}px;
    font-size:${sz>68?0.78:0.70}rem;
    opacity:0; pointer-events:auto; transition:opacity 0.6s ease;
  `;
  sceneEl.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.opacity='1'; }));

  const entry = { el, desire, sz, side, px:pos.px, py:pos.py, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3 };
  el.onclick = ()=>onBubbleClick(entry);
  idleBubbles.push(entry);
  return entry;
}

// ═══════════════════════════════════════════════════
//  CLICK → RISE TO CENTER
// ═══════════════════════════════════════════════════
function onBubbleClick(entry) {
  if (entry.clicked) return;
  entry.clicked = true;

  const slotIdx = risingSlots.findIndex(s=>s===null);
  if (slotIdx === -1) { entry.clicked=false; showToast('最多同时觉察 3 个欲望'); return; }

  idleBubbles = idleBubbles.filter(b=>b!==entry);
  const { el, desire, sz, side } = entry;

  el.style.transition   = 'none';
  el.style.left         = `${entry.px - sz/2}px`;
  el.style.top          = `${entry.py - sz/2}px`;
  el.classList.remove('idle', side);
  el.classList.add('rising');
  el.style.animation    = 'none';
  el.style.pointerEvents= 'none';

  const target = surfaceSlotPos();
  const dist   = Math.hypot(target.x-(entry.px-sz/2), target.y-(entry.py-sz/2));
  const dur    = Math.max(0.7, dist / RISE_SPEED);

  el.style.transition = `left ${dur.toFixed(2)}s cubic-bezier(0.3,1.2,0.6,1),`
                      + `top  ${dur.toFixed(2)}s cubic-bezier(0.3,1.2,0.6,1),`
                      + `width ${dur.toFixed(2)}s ease, height ${dur.toFixed(2)}s ease`;
  el.style.left   = `${target.x - TSZ/2}px`;
  el.style.top    = `${target.y - TSZ/2}px`;
  el.style.width  = `${TSZ}px`;
  el.style.height = `${TSZ}px`;
  el.style.zIndex = '14';

  risingSlots[slotIdx] = { el, desire, slotIdx, tSz:TSZ, side };

  setTimeout(()=>{
    el.classList.remove('rising');
    el.classList.add('at-surface');
    el.style.transition = '';
    tryMerge();
    updateInstruction();
  }, dur*1000 + 60);
}

// ═══════════════════════════════════════════════════
//  MERGE BUBBLE AT SURFACE
// ═══════════════════════════════════════════════════
function tryMerge() {
  const atSurface = risingSlots
    .map((s,i) => s && s.el.classList.contains('at-surface') ? {...s, idx:i} : null)
    .filter(Boolean);
  if (!atSurface.length) return;

  if (mergedBubble) { mergedBubble.el.remove(); mergedBubble=null; }

  for (const e of atSurface) { e.el.style.opacity='0'; e.el.style.pointerEvents='none'; }

  const desires = atSurface.map(e=>e.desire);
  const count   = desires.length;
  const mSz     = 92 + (count-1)*28;

  const seen  = new Set();
  const lines = atSurface.map(e=>{
    const key = e.desire.key + e.side;
    if (seen.has(key)) return null; seen.add(key);
    return e.desire.label.replace('\n','');
  }).filter(Boolean);

  const cls = count===1 ? desires[0].cls
    : count===2 ? (desires[0].cls===desires[1].cls ? desires[0].cls : 'bm')
    : 'bm3';

  const wy = waterY(), cx = vw()*0.50, cy = wy - mSz*1.1;

  const el = document.createElement('div');
  el.className = `bubble at-surface merged ${cls}`;
  el.innerHTML = lines.join('<br>');
  el.style.cssText = `
    width:${mSz}px; height:${mSz}px;
    left:${cx-mSz/2}px; top:${cy-mSz/2}px;
    font-size:${count>1?0.72:0.82}rem;
    position:fixed; z-index:15; opacity:0; pointer-events:none;
    transition:opacity 0.4s ease,width 0.5s ease,height 0.5s ease,left 0.5s ease,top 0.5s ease;
  `;
  document.body.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.opacity='1'; }));

  mergedBubble = { el, desires, sz:mSz, atSurface, cy };

  // Show buttons + question
  const deny  = document.getElementById('sharedDeny');
  const allow = document.getElementById('sharedAllow');
  const q     = document.getElementById('surfQ');
  const gap   = 16;
  deny.style.left  = `${cx - mSz/2 - 64 - gap}px`;
  deny.style.top   = `${cy - 32}px`;
  allow.style.left = `${cx + mSz/2 + gap}px`;
  allow.style.top  = `${cy - 32}px`;
  deny.classList.add('show');
  allow.classList.add('show');
  // surfQ: just above the bubble top edge, with some breathing room
  const bubbleTop = cy - mSz/2;
  const headerBottom = 72;
  const aboveBubble = bubbleTop - 20;
  q.style.top = `${Math.max(headerBottom + 10, aboveBubble)}px`;
  q.style.left = '';
  q.style.transform = 'translateX(-50%) translateY(-100%)';
  q.classList.add('show');
}

// ═══════════════════════════════════════════════════
//  DECISION (step 1: allow / deny)
// ═══════════════════════════════════════════════════
let pendingAtSurface = null;   // held between step 1 and step 2

function handleDecision(allow) {
  if (!mergedBubble) return;
  ['sharedDeny','sharedAllow','surfQ'].forEach(id=>document.getElementById(id).classList.remove('show'));

  const labels = [...new Set(mergedBubble.desires.map(d=>d.label.replace('\n','')))].join('、');

  // Save bubble state for step 2
  pendingAtSurface = {
    el: mergedBubble.el,
    atSurface: mergedBubble.atSurface,
    labels,
    allowedStep1: allow,
    cy: mergedBubble.cy,
    sz: mergedBubble.sz,
  };
  mergedBubble = null;

  // Show step 2: can you let go?
  const rqText = document.getElementById('releaseQText');
  rqText.innerHTML = `你能放下想要「${labels}」的欲望吗？`;

  const { cy, sz } = pendingAtSurface;
  const cx2 = vw() * 0.50;
  const gap2 = 16;
  const rqNo  = document.getElementById('rqNo');
  const rqYes = document.getElementById('rqYes');
  rqNo.style.left  = `${cx2 - sz/2 - 64 - gap2}px`;
  rqNo.style.top   = `${cy - 32}px`;
  rqYes.style.left = `${cx2 + sz/2 + gap2}px`;
  rqYes.style.top  = `${cy - 32}px`;
  rqNo.classList.add('show');
  rqYes.classList.add('show');

  const rq = document.getElementById('releaseQ');
  const bubbleTop = cy - sz / 2;
  const headerBottom = 72;
  rq.style.top = `${Math.max(headerBottom + 10, bubbleTop - 20)}px`;
  rq.style.transform = 'translateX(-50%) translateY(-100%)';
  rq.classList.add('show');
}

// ═══════════════════════════════════════════════════
//  RELEASE (step 2: can / cannot let go)
// ═══════════════════════════════════════════════════
function handleRelease(canRelease) {
  if (!pendingAtSurface) return;
  ['releaseQ','rqNo','rqYes'].forEach(id=>document.getElementById(id).classList.remove('show'));

  const { el, atSurface, labels, allowedStep1 } = pendingAtSurface;
  pendingAtSurface = null;

  // Toast based on both answers
  let msg;
  if (allowedStep1 && canRelease)  msg = `🌸 你允许了，也放下了「${labels}」`;
  else if (allowedStep1)            msg = `✨ 你允许了它——即使还放不下，也没关系`;
  else if (canRelease)              msg = `🌿 即使不允许，你已放下「${labels}」`;
  else                              msg = `✨ 即使不允许、也放不下，它依然悄然离去了`;
  showToast(msg);

  el.style.transition = 'none';
  el.classList.add('go-sky');

  setTimeout(()=>{
    el.remove();
    for (const e of atSurface) {
      e.el.remove();
      risingSlots[e.idx] = null;
      released++;
      if (e.side === 'L') sessionStats.left++;
      else sessionStats.right++;
      setTimeout(()=>spawnIdleBubble(e.desire, e.side), 800);
    }
    document.getElementById('counter').textContent = `已释放 ${released} 个欲望`;
    updateInstruction();
  }, 1950);
}

// ═══════════════════════════════════════════════════
//  INSTRUCTION / TOAST
// ═══════════════════════════════════════════════════
// ═══════════════════════════════════════════════════
//  GUIDANCE CARD
// ═══════════════════════════════════════════════════
let currentTopic = '';

function skyCardTop() {
  // Returns the top value for any centered sky card
  // Positions it in the lower half of the sky area, just above waterline
  const wy = waterY();
  // 动态获取 safe area top，让标题避开刘海
  const safeTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat') || '0') || 0;
  const headerBottom = Math.max(90, safeTop + 80);  // F按钮底边以下
  return headerBottom + (wy - headerBottom) * 0.62;
}

function positionGuidanceCard() {
  const card = document.getElementById('guidanceCard');
  card.style.top = `${skyCardTop()}px`;
  card.style.transform = 'translateX(-50%) translateY(-50%)';
}

function setGuidance(main, sub) {
  const card = document.getElementById('guidanceCard');
  const mainEl = document.getElementById('guidanceMain');
  const subEl  = document.getElementById('guidanceSub');
  card.classList.add('hidden');
  setTimeout(() => {
    mainEl.innerHTML = main || '';
    subEl.innerHTML  = sub  || '';
    if (!main && !sub) return;
    card.classList.remove('hidden');
  }, 300);
}

function updateInstruction() {
  const active = risingSlots.filter(Boolean).length;
  const atSurf = risingSlots.filter(s=>s&&s.el.classList.contains('at-surface')).length;
  const L = sessionStats.left;
  const R = sessionStats.right;
  const topic = currentTopic;
  const t = topic ? `「${topic}」` : '它';

  if (atSurf > 0) {
    setGuidance('', '');
    return;
  }

  if (active > 0) {
    setGuidance('欲望正在上浮……', '静静感受，不需要做任何事');
    return;
  }

  // Decide which side to prompt next
  const promptLeft = (L <= R);
  const isFirstRound = (L === 0 && R === 0);

  if (isFirstRound || promptLeft) {
    const main = isFirstRound
      ? `${t}能给我带来什么好处？`
      : L === 1
        ? `还有哪些好处是你想到的？`
        : `再感受一次——还有什么好处浮现了？`;
    setGuidance(
      main,
      '这些想法或感受中，是否掺杂着<br>想要被认同、想要控制、或想要安全妥当的欲望？'
    );
  } else {
    const main = R === 0
      ? `${t}会带来什么坏处？`
      : R === 1
        ? `坏处这一面，还有什么在里面？`
        : `继续感受——坏处里还藏着什么？`;
    setGuidance(
      main,
      '这份担心背后，是否掺杂着<br>想要被认同、想要控制、或想要安全妥当的欲望？'
    );
  }
}

// ═══════════════════════════════════════════════════
//  SESSION STATS (track left/right releases)
// ═══════════════════════════════════════════════════
const sessionStats = { left: 0, right: 0 };

// ═══════════════════════════════════════════════════
//  TOPIC MODAL
// ═══════════════════════════════════════════════════
function startSession() {
  const topic = document.getElementById('topicInput').value.trim();
  const overlay = document.getElementById('topicOverlay');
  overlay.classList.add('hide');
  currentTopic = topic;
  setTimeout(()=>{ positionGuidanceCard(); updateInstruction(); }, 650);
}

document.addEventListener('DOMContentLoaded', ()=>{
  const input = document.getElementById('topicInput');
  if (input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') startSession(); });
});
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ═══════════════════════════════════════════════════
//  LABEL POSITIONS
// ═══════════════════════════════════════════════════
function positionLabels() {
  const wy = waterY();
  document.getElementById('lbCL').style.top  = `${wy-70}px`;
  document.getElementById('lbSL').style.top  = `${wy+82}px`;
  // Place tags just below the waterline
  const tagY = `${wy + 14}px`;
  document.getElementById('lblBenefit').style.top  = tagY;
  document.getElementById('lblDrawback').style.top = tagY;
  positionGuidanceCard();
}

// ═══════════════════════════════════════════════════
//  ANIMATED WAVES — left clear, right murky
// ═══════════════════════════════════════════════════
let waveOffset  = 0;
let waveOffset2 = 0;
let waveOffset3 = 0;

function drawWaves() {
  const W=vw(), hw=halfW(), wy=waterY(), H=vh();
  const amp=10, amp2=6;
  waveOffset  += 0.012;
  waveOffset2 += 0.0079;
  waveOffset3 += 0.0103;

  // Single continuous wave-height function spanning the FULL width.
  // Left and right paths both sample THIS SAME function, so the
  // shape never breaks at the midline — only the fill colour changes.
  const waveY = (x) => wy
    + Math.sin((x/W)*Math.PI*3.4 + waveOffset)  * amp*0.60
    + Math.sin((x/W)*Math.PI*6.1 + waveOffset2) * amp*0.28
    + Math.sin((x/W)*Math.PI*1.7 + waveOffset3) * amp*0.35;

  let dL = `M 0 ${waveY(0)}`;
  for (let x=6; x<=hw; x+=6) dL += ` L ${x} ${waveY(x)}`;
  dL += ` L ${hw} ${waveY(hw)} L ${hw} ${H} L 0 ${H} Z`;
  document.getElementById('waveL').setAttribute('d',dL);

  let dR = `M ${hw} ${waveY(hw)}`;
  for (let x=hw+6; x<=W; x+=6) dR += ` L ${x} ${waveY(x)}`;
  dR += ` L ${W} ${H} L ${hw} ${H} Z`;
  document.getElementById('waveR').setAttribute('d',dR);

  // Secondary shimmer — same continuous-shape approach, thin highlight
  // band right at the surface
  const shimmerY = (x) => wy
    + Math.sin((x/W)*Math.PI*5 + waveOffset*1.6+1) * amp2
    + Math.cos((x/W)*Math.PI*3 + waveOffset*0.9)   * (amp2*0.5);

  let d2L = `M 0 ${shimmerY(0)}`;
  for (let x=8; x<=hw; x+=8) d2L += ` L ${x} ${shimmerY(x)}`;
  d2L += ` L ${hw} ${shimmerY(hw)} L ${hw} ${wy+18} L 0 ${wy+18} Z`;
  document.getElementById('waveL2').setAttribute('d',d2L);

  let d2R = `M ${hw} ${shimmerY(hw)}`;
  for (let x=hw+8; x<=W; x+=8) d2R += ` L ${x} ${shimmerY(x)}`;
  d2R += ` L ${W} ${wy+18} L ${hw} ${wy+18} Z`;
  document.getElementById('waveR2').setAttribute('d',d2R);

  const svg = document.getElementById('waterSvg');
  svg.setAttribute('height', `${H}px`);
  svg.style.top = '0px';

  requestAnimationFrame(drawWaves);
}

// ═══════════════════════════════════════════════════
//  CLOUDS, RAYS, PARTICLES, AMBIENT
// ═══════════════════════════════════════════════════
function spawnCloud(type) {
  const el = document.createElement('div');
  el.className = `cloud ${type}`;
  const h=16+Math.random()*28, w=55+Math.random()*115;
  const top=6+Math.random()*(waterY()*0.50), dur=26+Math.random()*32;
  el.style.cssText = `width:${w}px;height:${h}px;top:${top}px;animation-duration:${dur}s;animation-delay:${-Math.random()*dur}s;`;
  document.getElementById('skyClouds').appendChild(el);
}
for (let i=0;i<5;i++) spawnCloud('bright');
for (let i=0;i<4;i++) spawnCloud('grey');

const uwRaysEl = document.getElementById('uwRays');
for (let i=0;i<6;i++) {
  const r=document.createElement('div'); r.className='ray r-clear';
  r.style.cssText=`left:${3+i*8+Math.random()*5}%;height:${110+Math.random()*200}px;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*3}s;opacity:${0.28+Math.random()*0.38};`;
  uwRaysEl.appendChild(r);
}
for (let i=0;i<5;i++) {
  const r=document.createElement('div'); r.className='ray r-murky';
  r.style.cssText=`left:${53+i*9+Math.random()*5}%;height:${80+Math.random()*140}px;animation-duration:${4+Math.random()*4}s;animation-delay:${Math.random()*4}s;opacity:${0.10+Math.random()*0.16};`;
  uwRaysEl.appendChild(r);
}

const sceneEl = document.getElementById('scene');

function spawnUwParticle(side) {
  const p = document.createElement('div');
  p.className = `uw-particle ${side==='L'?'pL':'pR'}`;
  const s=2+Math.random()*5;
  const xPct=side==='L' ? Math.random()*46 : 52+Math.random()*46;
  p.style.cssText=`width:${s}px;height:${s}px;left:${xPct}%;bottom:${Math.random()*45}%;animation-duration:${8+Math.random()*12}s;animation-delay:${Math.random()*10}s;`;
  sceneEl.appendChild(p);
}
for (let i=0;i<14;i++) spawnUwParticle('L');
for (let i=0;i<10;i++) spawnUwParticle('R');

for (let i=0;i<22;i++) {
  const s=document.createElement('div'); s.className='murk-speck';
  const sz=3+Math.random()*9;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${52+Math.random()*44}%;top:${54+Math.random()*43}%;animation-duration:${6+Math.random()*10}s;animation-delay:${Math.random()*8}s;`;
  document.body.appendChild(s);
}

function spawnAmbient() {
  const isL=Math.random()<0.55;
  const sz=isL?7+Math.random()*20:4+Math.random()*12;
  const xPct=isL?2+Math.random()*44:52+Math.random()*44;
  const dur=4+Math.random()*7;
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;width:${sz}px;height:${sz}px;`
    +`left:${xPct}vw;top:${vh()+sz}px;border-radius:50%;pointer-events:none;z-index:6;`
    +`background:radial-gradient(circle at 35% 30%,${isL?'rgba(155,218,255,0.42),rgba(55,138,228,0.17)':'rgba(70,115,175,0.28),rgba(15,35,80,0.18)'});`
    +`border:1px solid ${isL?'rgba(135,208,255,0.32)':'rgba(40,85,160,0.28)'};`
    +`transition:top ${dur.toFixed(1)}s linear,opacity ${dur.toFixed(1)}s ease;opacity:0.65;`;
  sceneEl.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.top=`${waterY()-sz*1.5}px`; el.style.opacity='0'; }));
  setTimeout(()=>el.remove(), dur*1000+200);
}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
window.addEventListener('load', ()=>{
  positionLabels();
  drawWaves();
  setTimeout(()=>{
    for (let i=0;i<IDLE_PER_SIDE;i++) spawnIdleBubble(null,'L');
    for (let i=0;i<IDLE_PER_SIDE;i++) spawnIdleBubble(null,'R');
    physicsTick();
    setInterval(()=>{
      const nL=idleBubbles.filter(b=>b.side==='L').length;
      const nR=idleBubbles.filter(b=>b.side==='R').length;
      if (nL<IDLE_PER_SIDE) spawnIdleBubble(null,'L');
      if (nR<IDLE_PER_SIDE) spawnIdleBubble(null,'R');
    }, SPAWN_GAP);
    setInterval(spawnAmbient, 185);
  }, 300);
});

window.addEventListener('resize', positionLabels);
</script>
