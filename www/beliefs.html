<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>限制性信念释放</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #bae6fd;
  display: block;
  overflow: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(186,230,253,0.6) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(147,217,248,0.5) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
input, select, textarea, button { font-size: 16px; }

/* ─── 返回助手按钮 ─── */
.back-to-assistant {
  position: fixed;
  top: max(22px, calc(env(safe-area-inset-top, 0px) + 8px));
  left: 14px; z-index: 100;
  height: 36px;
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(12px);
  border: none; border-radius: 99px;
  padding: 0 14px;
  font-size: 0.82rem; font-family: 'Noto Sans SC', sans-serif;
  color: rgba(3,80,140,0.85);
  box-shadow: 0 2px 10px rgba(0,60,120,0.12);
  cursor: pointer; letter-spacing: 0.04em;
  display: flex; align-items: center;
}
.back-to-assistant:active { opacity: 0.7; }

/* ─── background ─── */
.card {
  position: relative; z-index: 1;
  width: 100vw; height: 100vh;
  background: linear-gradient(170deg, #cff4ff 0%, #bae6fd 45%, #90d8f5 100%);
}

/* ─── App title ─── */
.app-title {
  position: absolute; top: max(22px, calc(env(safe-area-inset-top, 0px) + 8px)); left: 0; right: 0;
  text-align: center; z-index: 10; pointer-events: none;
}
.app-title h1 {
  font-family: 'ZCOOL XiaoWei', serif; font-size: 13px;
  letter-spacing: 5px; color: rgba(3,105,161,0.55); font-weight: 400;
}
.app-title p {
  font-size: 8px; letter-spacing: 2.5px;
  color: rgba(3,105,161,0.32); margin-top: 3px;
}

/* ─── SVG canvas (body silhouette layer) ─── */
.svg-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  overflow: visible;
  z-index: 5;
  pointer-events: none;
}

/* ─── question text ─── */
#questionEl {
  position: absolute; left: 0; right: 0;
  top: 17%;
  text-align: center;
  font-family: 'ZCOOL XiaoWei', serif; font-size: 13px; letter-spacing: 2px;
  color: rgba(3,105,161,0.75); line-height: 1.9;
  z-index: 30; opacity: 0; pointer-events: none;
  transition: opacity 1.5s ease;
  padding: 0 36px;
}
#questionEl.visible { opacity: 1; }
#questionEl em {
  font-style: normal;
  color: rgba(3,105,161,0.95);
  font-size: 15px;
}

/* ─── action buttons ─── */
.act-btn {
  position: absolute; z-index: 30;
  padding: 9px 22px; border-radius: 99px;
  border: 1px solid rgba(255,255,255,0.95);
  background:
    linear-gradient(to bottom,
      rgba(255,255,255,0.92) 0%,
      rgba(255,255,255,0.78) 45%,
      rgba(220,235,245,0.72) 100%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-family: 'ZCOOL XiaoWei', serif; font-size: 16px;
  letter-spacing: 2.5px; color: rgba(3,105,161,0.92);
  cursor: pointer; white-space: nowrap;
  opacity: 0; pointer-events: none;
  box-shadow:
    /* outer drop shadow */
    0 4px 12px rgba(3,80,140,0.18),
    0 2px 4px rgba(3,80,140,0.10),
    /* inner top highlight */
    inset 0 1px 0 rgba(255,255,255,1),
    /* inner bottom subtle shadow */
    inset 0 -1px 2px rgba(3,80,140,0.08);
  transition: opacity 1.5s ease, transform 0.18s ease, background 0.2s ease, box-shadow 0.2s ease;
  transform: translate(-50%, -50%);
  top: 65%;
}
.act-btn.visible { opacity: 1; pointer-events: auto; }
.act-btn:active {
  transform: translate(-50%, -50%) scale(0.96);
  box-shadow:
    0 2px 5px rgba(3,80,140,0.18),
    inset 0 1px 2px rgba(3,80,140,0.12);
}
.act-btn:hover {
  background:
    linear-gradient(to bottom,
      rgba(255,255,255,1) 0%,
      rgba(245,250,255,0.88) 45%,
      rgba(210,228,242,0.82) 100%);
}

/* heart is at x=183/360 ≈ 50.8% — buttons sit at moderate gap */
#btnYes    { left: calc(50.8% + 56px); }
#btnNo     { left: calc(50.8% - 56px); }
#btnCan    { left: calc(50.8% + 56px); }
#btnCannot { left: calc(50.8% - 56px); }

/* ─── ripple ─── */
.ripple-el {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 6;
  background: radial-gradient(circle, rgba(120, 180, 230, 0.55) 0%, rgba(120, 180, 230, 0) 70%);
  animation: rippleRelease 1.5s ease-out forwards;
  transform-origin: center center;
}
@keyframes rippleRelease {
  0%   { transform: translate(-50%,-50%) scale(0.3); opacity: 0.75; }
  100% { transform: translate(-50%,-50%) scale(4.5); opacity: 0; }
}

/* ─── heart glow ─── */
@keyframes heartPulse {
  0%,100% { opacity: 0.45; r: 56; }
  50%     { opacity: 0.85; r: 70; }
}
#svgHeartGlow { animation: heartPulse 3.5s ease-in-out infinite; }

@keyframes heartBoom {
  0%   { opacity: 0.45; r: 60; }
  18%  { opacity: 1;    r: 140; }
  50%  { opacity: 0.7;  r: 90; }
  100% { opacity: 0.45; r: 60; }
}
#svgHeartGlow.boom { animation: heartBoom 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1, heartPulse 3.5s ease-in-out infinite 1.6s; }

/* ─── body glow animations (matching Emotions.html) ─── */
@keyframes hg1{0%,100%{opacity:0.08}50%{opacity:0.28}}
@keyframes hg2{0%,100%{opacity:0.18}50%{opacity:0.6}}
@keyframes hg3{0%,100%{opacity:0.45}50%{opacity:1}}
@keyframes hcore{0%,100%{opacity:0.55}50%{opacity:1}}
.hg1{animation:hg1 6s ease-in-out infinite;}
.hg2{animation:hg2 5s ease-in-out infinite 0.5s;}
.hg3{animation:hg3 4s ease-in-out infinite 1s;}
.hcore{animation:hcore 4s ease-in-out infinite;}

/* ─── caption (bottom) ─── */
.caption {
  position: absolute; bottom: 16px; left: 0; right: 0;
  text-align: center; z-index: 10; pointer-events: none;
}
.caption p {
  font-size: 7.5px; letter-spacing: 2.5px;
  color: rgba(3,105,161,0.32);
  font-family: 'ZCOOL XiaoWei', serif;
}

/* ─── bottom counter ─── */
#bottomBar {
  position: absolute;
  bottom: max(36px, env(safe-area-inset-bottom, 36px));
  left: 50%; transform: translateX(-50%);
  z-index: 30; display: flex; align-items: center; gap: 14px;
  white-space: nowrap;
  pointer-events: none;
}
.bottom-text {
  font-family: 'ZCOOL XiaoWei', serif; font-size: 11px;
  letter-spacing: 2px; color: rgba(3,105,161,0.55);
}
.bottom-divider {
  width: 1px; height: 11px;
  background: rgba(3,105,161,0.25);
}

/* ─── category selector (custom dropdown) ─── */
.category-trigger {
  position: absolute;
  top: max(56px, calc(env(safe-area-inset-top, 0px) + 44px));
  left: 50%; transform: translateX(-50%);
  z-index: 100;
  padding: 6px 26px 6px 14px;
  border-radius: 99px;
  border: 1px solid rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.28);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 12px; letter-spacing: 2px;
  color: rgba(3,105,161,0.80);
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(3,80,140,0.10);
  /* dropdown arrow */
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%230369a1' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.2s;
}
.category-trigger:hover { background-color: rgba(255,255,255,0.45); }

.category-menu {
  position: absolute;
  top: calc(max(56px, calc(env(safe-area-inset-top, 0px) + 44px)) + 36px);
  left: 50%; transform: translateX(-50%);
  z-index: 101;
  min-width: 130px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.85);
  background: linear-gradient(158deg, rgba(222,246,255,0.92) 0%, rgba(186,230,253,0.88) 100%);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px rgba(3,80,140,0.18), 0 1px 0 rgba(255,255,255,0.7) inset;
  padding: 6px 0;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  transform: translateX(-50%) translateY(-6px);
}
.category-menu.open {
  opacity: 1; pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.category-item {
  padding: 10px 28px;
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 13px; letter-spacing: 3px;
  color: rgba(3,105,161,0.85);
  text-align: center;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.category-item:hover { background: rgba(255,255,255,0.45); }
.category-item.selected {
  background: rgba(255,255,255,0.35);
  color: rgba(3,105,161,1);
}

#loadingOverlay {
  position: absolute; inset: 0; z-index: 60;
  background: linear-gradient(170deg, #cff4ff 0%, #bae6fd 45%, #90d8f5 100%);
  display: flex; align-items: center; justify-content: center;
  font-family: 'ZCOOL XiaoWei', serif; font-size: 13px;
  letter-spacing: 3px; color: rgba(3,105,161,0.7);
  transition: opacity 0.4s ease;
}
#loadingOverlay.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<!-- ═══════════════ CARD / RELEASE PAGE ═══════════════ -->
<div class="card" id="card">
  <div class="app-title">
    <h1>限制性信念释放</h1>
    <p>觉察 · 允许 · 释放</p>
  </div>
  <div class="category-trigger" id="categoryTrigger">随机</div>
  <div class="category-menu" id="categoryMenu"></div>
  <div id="questionEl"></div>

  <svg class="svg-canvas" id="sv" viewBox="0 0 360 640">
    <defs id="svgDefs">
      <filter id="f1" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
      <filter id="f2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
      <filter id="f3" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="36"/></filter>
      <filter id="fd"  x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
      <radialGradient id="heartGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(255,255,255,1)" stop-opacity="0.95"/>
        <stop offset="40%"  stop-color="rgba(255,255,255,1)" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="rgba(255,255,255,1)" stop-opacity="0"/>
      </radialGradient>
      <!-- desire-themed energy gradients (used after "yes") -->
      <radialGradient id="heartGradient_control" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffe0c0"   stop-opacity="1"/>
        <stop offset="35%"  stop-color="#ff8050"   stop-opacity="0.85"/>
        <stop offset="75%"  stop-color="#c04030"   stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#7a2010"   stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="heartGradient_approval" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#f0d8ff"   stop-opacity="1"/>
        <stop offset="35%"  stop-color="#c890e8"   stop-opacity="0.85"/>
        <stop offset="75%"  stop-color="#9050b0"   stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#5a1880"   stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="heartGradient_safety" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#d0f0ff"   stop-opacity="1"/>
        <stop offset="35%"  stop-color="#60c0e8"   stop-opacity="0.85"/>
        <stop offset="75%"  stop-color="#2080a0"   stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#0a4860"   stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Human figure (white glow like Whole_process) -->
    <path class="hg1" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#f3)"/>
    <path class="hg2" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#f2)"/>
    <path class="hg3" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#f1)"/>
    <path class="hcore" d="M330 580 C330 490 320 410 312 372 C303 333 272 323 247 318 C222 313 210 303 210 276 C210 261 210 248 219 239 C241 213 232 143 183 143 C134 143 125 213 147 239 C156 248 156 261 156 276 C156 303 144 313 119 318 C94 323 63 333 54 372 C45 411 36 490 36 580"
      stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- heart energy glow (chest center) -->
    <circle id="svgHeartGlow" cx="183" cy="420" r="60"
      fill="url(#heartGradient)" opacity="0.85"/>

    <!-- desire orb floats here -->
    <g id="bubblesLayer"></g>
  </svg>

  <button class="act-btn" id="btnYes">是</button>
  <button class="act-btn" id="btnNo">否</button>
  <button class="act-btn" id="btnCan">能</button>
  <button class="act-btn" id="btnCannot">不能</button>

  <div id="bottomBar">
    <span class="bottom-text" id="counterText">今日 0</span>
    <span class="bottom-divider"></span>
    <span class="bottom-text" id="totalText">累计 0</span>
  </div>
</div>

<div id="loadingOverlay">加载中…</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════
const NS = 'http://www.w3.org/2000/svg';

// Three desires — natural, asymmetric arrangement near the heart (not symmetric)
const DESIRES = {
  control: {
    name: '想要控制',
    glow: '#b84040', stroke: '#ffcca0',
    s: ['#ffcca0','#c05030','#7a2010'],
    bodyPos: { x: 138, y: 388 }   // upper-left near heart
  },
  approval: {
    name: '想要被认同',
    glow: '#9050b0', stroke: '#e0b8ff',
    s: ['#e0b8ff','#9050b0','#5a1880'],
    bodyPos: { x: 232, y: 412 }   // mid-right near heart
  },
  safety: {
    name: '想要安全',
    glow: '#2080a0', stroke: '#a0e0ff',
    s: ['#a0e0ff','#2080a0','#0a4860'],
    bodyPos: { x: 175, y: 470 }   // lower-center, slightly off
  }
};

// Head target position (where the chosen orb floats up to)
const HEAD_X = 183, HEAD_Y = 205;

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let BELIEFS = null;
let CURRENT_QUEUE = [];
let QUEUE_INDEX = 0;
let CURRENT_Q = null;
let PHASE = 'question'; // 'question' | 'release'
let CURRENT_CATEGORY = 'all';

// ═══════════════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════════════
const STORAGE_KEY = 'lb_progress_v1';

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultProgress();
    const p = JSON.parse(raw);
    const today = new Date().toDateString();
    if (p.todayDate !== today) {
      p.todayCount = 0;
      p.todayDate = today;
    }
    return p;
  } catch(e) { return defaultProgress(); }
}
function defaultProgress() {
  return { total: 0, todayCount: 0, todayDate: new Date().toDateString(), byCategory: {}, byDesire: {} };
}
function saveProgress(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch(e){}
}
function incrementProgress(question) {
  const p = loadProgress();
  p.total += 1;
  p.todayCount += 1;
  p.todayDate = new Date().toDateString();
  p.byCategory[question.category] = (p.byCategory[question.category] || 0) + 1;
  p.byDesire[question.desire] = (p.byDesire[question.desire] || 0) + 1;
  saveProgress(p);
  updateCounter();
}

// ═══════════════════════════════════════════════════════════
//  LOAD BELIEFS
// ═══════════════════════════════════════════════════════════
async function loadBeliefs() {
  try {
    const res = await fetch('beliefs.json');
    if (!res.ok) throw new Error('fetch failed');
    BELIEFS = await res.json();
    document.getElementById('loadingOverlay').classList.add('hidden');
    initCategorySelector();
    startSession('all'); // auto-start with random
  } catch(e) {
    document.getElementById('loadingOverlay').innerHTML
      = '题库加载失败<br><small style="font-size:11px;">请检查 beliefs.json 是否就位</small>';
    console.error(e);
  }
}

// ═══════════════════════════════════════════════════════════
//  CATEGORY SELECTOR (custom dropdown)
// ═══════════════════════════════════════════════════════════
function initCategorySelector() {
  const trigger = document.getElementById('categoryTrigger');
  const menu = document.getElementById('categoryMenu');
  menu.innerHTML = '';

  const items = [
    { id: 'all', label: '随机' },
    ...Object.keys(BELIEFS.categories).map(catId => ({
      id: catId,
      label: BELIEFS.categories[catId].name
    }))
  ];

  let currentId = 'all';

  function buildMenu() {
    menu.innerHTML = '';
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'category-item' + (item.id === currentId ? ' selected' : '');
      el.textContent = item.label;
      el.onclick = (e) => {
        e.stopPropagation();
        currentId = item.id;
        trigger.textContent = item.label;
        menu.classList.remove('open');
        buildMenu();
        startSession(item.id);
      };
      menu.appendChild(el);
    });
  }
  buildMenu();

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  // close menu when clicking elsewhere
  document.addEventListener('click', () => {
    menu.classList.remove('open');
  });
}

// ═══════════════════════════════════════════════════════════
//  SESSION
// ═══════════════════════════════════════════════════════════
function startSession(categoryId) {
  CURRENT_CATEGORY = categoryId;
  let pool = (categoryId === 'all')
    ? BELIEFS.questions.slice()
    : BELIEFS.questions.filter(q => q.category === categoryId);
  CURRENT_QUEUE = shuffle(pool);
  QUEUE_INDEX = 0;
  // clear any in-progress state
  hideEl('questionEl');
  hideBtn('btnYes');
  hideBtn('btnNo');
  hideBtn('btnCan');
  hideBtn('btnCannot');
  clearAllDesireOrbs();
  updateCounter();
  showNextQuestion();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showNextQuestion() {
  if (QUEUE_INDEX >= CURRENT_QUEUE.length) {
    CURRENT_QUEUE = shuffle(CURRENT_QUEUE);
    QUEUE_INDEX = 0;
  }
  CURRENT_Q = CURRENT_QUEUE[QUEUE_INDEX];
  PHASE = 'question';
  hideBtn('btnCan');
  hideBtn('btnCannot');

  // spawn all 3 desire bubbles at the heart area
  spawnAllDesireOrbs();

  // show question text
  const qEl = document.getElementById('questionEl');
  qEl.textContent = CURRENT_Q.question;
  setTimeout(() => {
    showEl('questionEl');
    setTimeout(() => {
      showBtn('btnYes');
      showBtn('btnNo');
    }, 400);
  }, 200);
}

// ═══════════════════════════════════════════════════════════
//  ANSWER: 否
// ═══════════════════════════════════════════════════════════
function onAnswerNo() {
  hideBtn('btnYes');
  hideBtn('btnNo');
  hideEl('questionEl');
  // fade out all 3 desire bubbles
  fadeOutAllDesireOrbs();
  setTimeout(() => {
    clearAllDesireOrbs();
    QUEUE_INDEX += 1;
    showNextQuestion();
  }, 800);
}

// ═══════════════════════════════════════════════════════════
//  ANSWER: 是 → release phase
// ═══════════════════════════════════════════════════════════
function onAnswerYes() {
  hideBtn('btnYes');
  hideBtn('btnNo');
  hideEl('questionEl');
  PHASE = 'release';

  // boom the heart
  boomHeart();

  // float the chosen orb up to head; other two stay
  setTimeout(() => {
    floatChosenOrbToHead();
  }, 400);

  // show release question (above head)
  setTimeout(() => {
    const qEl = document.getElementById('questionEl');
    const desireName = DESIRES[CURRENT_Q.desire].name;
    qEl.innerHTML = `你能允许这种<em>${desireName}</em>离开吗？`;
    showEl('questionEl');
    setTimeout(() => {
      showBtn('btnCan');
      showBtn('btnCannot');
    }, 400);
  }, 1300);
}

// ═══════════════════════════════════════════════════════════
//  DESIRE ORBS
// ═══════════════════════════════════════════════════════════
let desireOrbs = {}; // { control: el, approval: el, safety: el }

function spawnAllDesireOrbs() {
  // clear any leftover orbs first
  clearAllDesireOrbs();

  ['control', 'approval', 'safety'].forEach((key, i) => {
    setTimeout(() => {
      spawnDesireOrb(key);
    }, i * 200);
  });
}

function spawnDesireOrb(key) {
  const d = DESIRES[key];
  const layer = document.getElementById('bubblesLayer');
  const defs = document.getElementById('svgDefs');

  // gradient
  const gid = 'grad_' + key + '_' + Date.now();
  const rg = document.createElementNS(NS, 'radialGradient');
  rg.setAttribute('id', gid);
  rg.setAttribute('cx','38%'); rg.setAttribute('cy','32%'); rg.setAttribute('r','65%');
  [[d.s[0], 0.95, '0%'], [d.s[1], 0.78, '55%'], [d.s[2], 0.68, '100%']].forEach(([c, op, off]) => {
    const st = document.createElementNS(NS,'stop');
    st.setAttribute('offset', off);
    st.setAttribute('stop-color', c);
    st.setAttribute('stop-opacity', op);
    rg.appendChild(st);
  });
  defs.appendChild(rg);

  const g = document.createElementNS(NS, 'g');
  g.setAttribute('data-desire', key);
  g.setAttribute('transform', `translate(${d.bodyPos.x},${d.bodyPos.y})`);
  g.style.opacity = '0';
  g.style.transition = 'opacity 0.8s ease, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1)';

  // outer glow (blurred halo around the orb)
  const glow = document.createElementNS(NS, 'circle');
  glow.setAttribute('r', 38);
  glow.setAttribute('fill', d.glow);
  glow.setAttribute('filter', 'url(#fd)');
  glow.setAttribute('fill-opacity', '0.45');

  // body
  const bod = document.createElementNS(NS, 'circle');
  bod.setAttribute('r', 32);
  bod.setAttribute('fill', `url(#${gid})`);

  // rim
  const rim = document.createElementNS(NS, 'circle');
  rim.setAttribute('r', 32);
  rim.setAttribute('fill', 'none');
  rim.setAttribute('stroke', d.stroke);
  rim.setAttribute('stroke-width', '1.2');
  rim.setAttribute('stroke-opacity', '0.85');

  // highlight
  const h1 = document.createElementNS(NS, 'ellipse');
  h1.setAttribute('rx', '10');
  h1.setAttribute('ry', '5');
  h1.setAttribute('fill', 'white');
  h1.setAttribute('fill-opacity', '0.28');
  h1.setAttribute('transform', 'translate(-8,-11)');

  // label
  const tx = document.createElementNS(NS, 'text');
  tx.setAttribute('text-anchor', 'middle');
  tx.setAttribute('dy', '0.35em');
  tx.setAttribute('font-size', '8');
  tx.setAttribute('font-family', "'Noto Serif SC',serif");
  tx.setAttribute('fill', 'white');
  tx.setAttribute('fill-opacity', '0.92');
  tx.textContent = d.name;

  [glow, bod, rim, h1, tx].forEach(el => g.appendChild(el));
  layer.appendChild(g);

  // fade in
  requestAnimationFrame(() => { g.style.opacity = '1'; });

  desireOrbs[key] = g;
}

function floatChosenOrbToHead() {
  const chosenKey = CURRENT_Q.desire;
  const orb = desireOrbs[chosenKey];
  if (orb) {
    orb.setAttribute('transform', `translate(183,205)`);
  }
}

function fadeOutAllDesireOrbs() {
  Object.values(desireOrbs).forEach(orb => {
    orb.style.opacity = '0';
  });
}

function clearAllDesireOrbs() {
  const layer = document.getElementById('bubblesLayer');
  if (layer) layer.innerHTML = '';
  desireOrbs = {};
}

// ═══════════════════════════════════════════════════════════
//  RELEASE: 能 / 不能 — both float bubble away
// ═══════════════════════════════════════════════════════════
function onCanRelease()    { completeRelease(); }
function onCannotRelease() { completeRelease(); }

function completeRelease() {
  hideBtn('btnCan');
  hideBtn('btnCannot');
  hideEl('questionEl');

  // float the chosen orb up and out
  const chosenKey = CURRENT_Q.desire;
  const chosen = desireOrbs[chosenKey];
  if (chosen) {
    chosen.style.transition = 'opacity 1.3s ease-out, transform 1.5s cubic-bezier(0.4, 0, 0.6, 1)';
    chosen.setAttribute('transform', `translate(183,-50)`);
    setTimeout(() => { chosen.style.opacity = '0'; }, 100);
  }

  // fade out the other two orbs
  Object.keys(desireOrbs).forEach(key => {
    if (key !== chosenKey) {
      desireOrbs[key].style.opacity = '0';
    }
  });

  triggerRipple();
  playBubbleRise();
  incrementProgress(CURRENT_Q);

  setTimeout(() => {
    clearAllDesireOrbs();
    QUEUE_INDEX += 1;
    showNextQuestion();
  }, 1500);
}

// ═══════════════════════════════════════════════════════════
//  VISUAL EFFECTS
// ═══════════════════════════════════════════════════════════
function boomHeart() {
  const h = document.getElementById('svgHeartGlow');
  h.classList.remove('boom');
  void h.offsetWidth;
  h.classList.add('boom');
}

function getHeartScreenPos() {
  const svg = document.getElementById('sv');
  const rect = svg.getBoundingClientRect();
  return {
    x: rect.left + (183 / 360) * rect.width,
    y: rect.top  + (420 / 640) * rect.height
  };
}

function triggerRipple() {
  const card = document.getElementById('card');
  const p = getHeartScreenPos();
  for (let i = 0; i < 2; i++) {
    setTimeout(() => {
      const r = document.createElement('div');
      r.className = 'ripple-el';
      r.style.left = p.x + 'px';
      r.style.top  = p.y + 'px';
      r.style.width = '120px';
      r.style.height = '120px';
      card.appendChild(r);
      setTimeout(() => r.remove(), 1600);
    }, i * 200);
  }
}

// ═══════════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════════
function showEl(id) { document.getElementById(id).classList.add('visible'); }
function hideEl(id) { document.getElementById(id).classList.remove('visible'); }
function showBtn(id) { document.getElementById(id).classList.add('visible'); }
function hideBtn(id) { document.getElementById(id).classList.remove('visible'); }

function updateCounter() {
  const p = loadProgress();
  document.getElementById('counterText').textContent = '今日 ' + p.todayCount;
  document.getElementById('totalText').textContent = '累计 ' + p.total;
}

document.getElementById('btnYes').addEventListener('click', onAnswerYes);
document.getElementById('btnNo').addEventListener('click', onAnswerNo);
document.getElementById('btnCan').addEventListener('click', onCanRelease);
document.getElementById('btnCannot').addEventListener('click', onCannotRelease);

loadBeliefs();
</script>

<script>
// ── 泡泡飘出水面音效 ──
let _audioCtx = null;
function _getCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}
function playBubbleRise() {
  const ctx = _getCtx();
  const now = ctx.currentTime;

  // 1. 气泡上升 — 频率从低到高的短促音
  [0, 0.12, 0.26].forEach((delay, i) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320 + i * 80, now + delay);
    osc.frequency.exponentialRampToValueAtTime(800 + i * 120, now + delay + 0.18);
    g.gain.setValueAtTime(0, now + delay);
    g.gain.linearRampToValueAtTime(0.12, now + delay + 0.04);
    g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.22);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(now + delay);
    osc.stop(now + delay + 0.22);
  });

  // 2. 水面破裂 — 轻微白噪音
  const bufSize = Math.floor(ctx.sampleRate * 0.15);
  const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
  const noise = ctx.createBufferSource();
  noise.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 2000;
  const ng = ctx.createGain();
  ng.gain.setValueAtTime(0, now + 0.28);
  ng.gain.linearRampToValueAtTime(0.06, now + 0.32);
  ng.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
  noise.connect(filter);
  filter.connect(ng);
  ng.connect(ctx.destination);
  noise.start(now + 0.28);
  noise.stop(now + 0.45);
}
</script>
