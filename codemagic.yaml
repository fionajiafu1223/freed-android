workflows:
  ios-workflow:
    name: Freed 释放 iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Admin
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.freedreleasing.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6768422531
      node: 20.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: 安装 npm 依赖
        script: |
          npm install
      - name: 同步 Capacitor 到 iOS
        script: |
          npx cap add ios || npx cap sync ios
      - name: 生成 App 图标
        script: |
          npm install -g @capacitor/assets
          npx capacitor-assets generate --ios
      - name: 安装 CocoaPods
        script: |
          cd ios/App && pod install
      - name: 设置代码签名
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: 自增构建号
        script: |
          cd $CM_BUILD_DIR/ios/App
          AS_BUILD=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          TF_BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          LATEST=$(( AS_BUILD > TF_BUILD ? AS_BUILD : TF_BUILD ))
          NEW_BUILD=$(( LATEST + 1 ))
          echo "App Store 最新: $AS_BUILD | TestFlight 最新: $TF_BUILD | 本次构建号: $NEW_BUILD"
          agvtool new-version -all $NEW_BUILD
      - name: 构建 ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: Freed 释放 Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - freed-android
      vars:
        PACKAGE_NAME: "com.freedreleasing.app"
      node: 20.11.0
    scripts:
      - name: 安装 npm 依赖
        script: |
          npm install
          npm install @capacitor/android@6 --legacy-peer-deps
      - name: 同步 Capacitor 到 Android
        script: |
          npx cap add android || npx cap sync android
      - name: 设置版本号和 Target SDK
        script: |
          BUILD_NUM=${BUILD_NUMBER:-10}
          python3 -c "
          import re, sys
          build_num = sys.argv[1]
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', content)
          content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', content)
          content = re.sub(r'versionCode\s+\d+', 'versionCode ' + build_num, content)
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print('Done, versionCode=' + build_num)
          " $BUILD_NUM
      - name: 生成 App 图标
        script: |
          npm install -g @capacitor/assets
          npx capacitor-assets generate --android
      - name: 构建 AAB
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
